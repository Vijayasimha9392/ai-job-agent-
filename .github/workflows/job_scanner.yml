name: 24/7 AI Job Recommendation Agent

on:
  schedule:
    - cron: '*/55 * * * *'
  workflow_dispatch:

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit

      - name: Execute Discovery, AI Scoring & Email Dispatch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          CANDIDATE_NAME: "Vijayasimha Tammineni"
          CANDIDATE_EMAIL: ${{ secrets.CANDIDATE_EMAIL }}
          ALERT_RECEIVER_EMAIL: ${{ secrets.CANDIDATE_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_SECURE: true
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: "Job Hunter AI <${{ secrets.SMTP_USER }}>"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          MIN_MATCH_SCORE: 65
          MAX_JOB_AGE_HOURS: 30
          SCHEDULE_INTERVAL_MINUTES: 55
          ENABLE_EMAIL_NOTIFICATIONS: true
          ENABLE_TELEGRAM_NOTIFICATIONS: true
        run: node tests/test_live_single_run.js

      - name: Persist Notified State to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/job_state.json
          git commit -m "chore(db): persist notified jobs state [skip ci]" || echo "No new jobs to persist"
          git push origin main || echo "No changes to push"
